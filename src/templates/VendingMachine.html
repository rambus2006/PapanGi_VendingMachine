<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자판기</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --green-dark:#1a6b2a;
  --green-mid:#2d9e45;
  --green-light:#3dbf58;
  --green-bright:#5ad470;
  --metal:#c8cdd4;
  --metal-dark:#8a9098;
  --metal-light:#e8ecf0;
  --display-bg:#0a1a0d;
  --display-green:#00ff55;
  --shelf-white:#f0f2f5;
  --shelf-border:#d0d5dc;
}
body{
  background:#1a1a1a;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  font-family:'Noto Sans KR',sans-serif;
  padding:20px;
}
 
/* 자판기 본체 */
.machine{
  width:420px;
  background:linear-gradient(160deg,#2a8040 0%,var(--green-dark) 40%,#145520 100%);
  border-radius:12px 12px 6px 6px;
  padding:10px;
  box-shadow:
    inset 2px 0 6px rgba(255,255,255,0.15),
    inset -2px 0 6px rgba(0,0,0,0.3),
    0 20px 60px rgba(0,0,0,0.7),
    0 4px 16px rgba(0,0,0,0.5);
  position:relative;
}
 
/* 상단 로고 바 */
.top-bar{
  background:linear-gradient(90deg,#145520,#2d9e45,#145520);
  border-radius:6px 6px 0 0;
  padding:8px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:8px;
  border-bottom:2px solid #0d3d18;
}
.top-bar .machine-title{
  font-family:'Black Han Sans',sans-serif;
  font-size:18px;
  color:#fff;
  letter-spacing:.05em;
  text-shadow:0 1px 3px rgba(0,0,0,0.5);
}
.top-bar .temp-badge{
  font-size:10px;
  background:rgba(0,0,0,0.3);
  color:#aaffcc;
  padding:3px 8px;
  border-radius:20px;
  border:1px solid rgba(255,255,255,0.15);
}
 
/* 음료 디스플레이 창 */
.display-window{
  background:#e8edf2;
  border-radius:8px;
  border:4px solid #9aabad;
  box-shadow:
    inset 0 2px 8px rgba(0,0,0,0.2),
    inset 0 0 0 2px rgba(255,255,255,0.4);
  overflow:hidden;
  margin-bottom:8px;
  position:relative;
}
/* 창 반사 효과 */
.display-window::before{
  content:'';
  position:absolute;
  top:0;left:0;right:0;
  height:30%;
  background:linear-gradient(180deg,rgba(255,255,255,0.25),transparent);
  pointer-events:none;
  z-index:10;
  border-radius:4px 4px 0 0;
}
/* 내부 형광등 */
.shelf-light{
  background:linear-gradient(90deg,transparent,rgba(220,240,255,0.6),rgba(200,230,255,0.8),rgba(220,240,255,0.6),transparent);
  height:6px;
  margin:-2px 0 2px;
}
 
/* 선반 */
.shelf{
  background:var(--shelf-white);
  padding:8px 6px 0;
  border-bottom:6px solid #b0bac5;
  position:relative;
}
.shelf-items{
  display:flex;
  gap:3px;
  align-items:flex-end;
  padding-bottom:4px;
  min-height:72px;
  justify-content:center;
  flex-wrap:nowrap;
}
/* 선반 하단 가격표 줄 */
.price-row{
  display:flex;
  background:#1a4a88;
  border-top:1px solid #0d2a55;
}
.price-cell{
  flex:1;
  text-align:center;
  padding:2px 0;
  font-size:8px;
  color:#aaccff;
  font-family:'Noto Sans KR',sans-serif;
  border-right:1px solid rgba(255,255,255,0.1);
  white-space:nowrap;
  overflow:hidden;
}
.price-cell:last-child{border-right:none}
 
/* 음료 아이템 */
.drink{
  display:flex;
  flex-direction:column;
  align-items:center;
  cursor:pointer;
  flex:1;
  min-width:0;
  transition:transform .15s;
  position:relative;
}
.drink:hover{transform:translateY(-4px)}
.drink.selected .can,.drink.selected .bottle{
  filter:brightness(1.2);
  outline:2px solid #ffee00;
  border-radius:4px;
}
/* 캔 */
.can{
  width:32px;
  height:52px;
  border-radius:5px 5px 4px 4px;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:7px;
  font-weight:700;
  color:#fff;
  text-align:center;
  line-height:1.1;
  text-shadow:0 1px 2px rgba(0,0,0,0.5);
  overflow:hidden;
  box-shadow:inset -3px 0 6px rgba(0,0,0,0.25),inset 2px 0 4px rgba(255,255,255,0.2);
}
.can::before{
  content:'';position:absolute;top:0;left:0;right:0;height:6px;
  border-radius:5px 5px 0 0;
  background:rgba(255,255,255,0.15);
}
.can::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:5px;
  border-radius:0 0 4px 4px;
  background:rgba(0,0,0,0.2);
}
/* 페트병 */
.bottle{
  width:26px;
  height:62px;
  border-radius:4px 4px 6px 6px;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:7px;
  color:#fff;
  font-weight:700;
  text-align:center;
  line-height:1.1;
  text-shadow:0 1px 2px rgba(0,0,0,0.4);
  overflow:hidden;
  box-shadow:inset -2px 0 5px rgba(0,0,0,0.2),inset 2px 0 4px rgba(255,255,255,0.25);
}
.bottle::before{
  content:'';position:absolute;top:0;left:25%;right:25%;height:8px;
  border-radius:3px 3px 0 0;
  background:rgba(255,255,255,0.3);
}
 
/* 하단 패널 */
.bottom-panel{
  background:linear-gradient(180deg,#2a7838,#1a5528);
  border-radius:0 0 6px 6px;
  padding:10px;
  display:grid;
  grid-template-columns:1fr auto;
  gap:10px;
  margin-top:6px;
}
 
/* 왼쪽: 광고판 */
.ad-board{
  background:linear-gradient(135deg,#1d7a2e,#0d4d1a);
  border-radius:8px;
  border:2px solid #3aaa55;
  padding:10px 12px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  min-height:100px;
  position:relative;
  overflow:hidden;
}
.ad-board::before{
  content:'★';
  position:absolute;top:-10px;left:-10px;
  font-size:60px;color:rgba(255,255,255,0.05);
}
.ad-board::after{
  content:'★';
  position:absolute;bottom:-10px;right:-10px;
  font-size:80px;color:rgba(255,255,255,0.04);
}
.ad-brand{
  font-size:9px;color:rgba(255,255,255,0.6);letter-spacing:.15em;text-transform:uppercase;
}
.ad-name{
  font-family:'Black Han Sans',sans-serif;
  font-size:26px;color:#fff;
  line-height:1;
  margin:2px 0;
  text-shadow:0 2px 8px rgba(0,0,0,0.4);
}
.ad-name span{color:#afffbc}
.ad-sub{font-size:9px;color:rgba(255,255,255,0.5);letter-spacing:.05em}
 
/* 오른쪽: 조작부 */
.control-panel{
  display:flex;
  flex-direction:column;
  gap:7px;
  width:120px;
}
 
/* 디스플레이 */
.lcd{
  background:#0a1a0d;
  border:2px solid #1a4a25;
  border-radius:5px;
  padding:6px 8px;
  font-family:'Courier New',monospace;
  box-shadow:inset 0 0 8px rgba(0,0,0,0.5);
}
.lcd-row1{
  font-size:9px;color:#44bb66;letter-spacing:.05em;margin-bottom:2px;
}
.lcd-amount{
  font-size:18px;font-weight:700;
  color:var(--display-green);
  letter-spacing:.03em;
  text-shadow:0 0 8px rgba(0,255,85,0.4);
}
.lcd-status{
  font-size:8px;color:#336644;margin-top:1px;
}
 
/* 동전 투입구 */
.coin-slot-area{
  background:#111;
  border-radius:5px;
  border:2px solid #2a2a2a;
  padding:7px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
}
.coin-slot{
  width:100%;
  height:6px;
  background:#000;
  border-radius:3px;
  border:1px solid #333;
  box-shadow:inset 0 1px 3px rgba(0,0,0,0.8);
}
.coin-btns{
  display:flex;
  gap:4px;
  width:100%;
}
.coin-btn{
  flex:1;
  padding:4px 2px;
  font-size:8px;
  background:#222;
  color:#888;
  border:1px solid #444;
  border-radius:3px;
  cursor:pointer;
  text-align:center;
  font-family:'Noto Sans KR',sans-serif;
  transition:all .1s;
}
.coin-btn:hover{background:#333;color:#aaa}
.coin-btn:active{transform:scale(.96)}
.slot-label{font-size:7px;color:#555;letter-spacing:.05em}
 
/* 카드 리더기 */
.card-reader{
  background:#1a1a1a;
  border:2px solid #2a2a2a;
  border-radius:5px;
  padding:6px 8px;
  display:flex;
  align-items:center;
  gap:6px;
  cursor:pointer;
}
.card-reader:hover .card-slot{border-color:#4488ff}
.card-slot{
  width:28px;height:18px;
  background:#000;
  border:1.5px solid #333;
  border-radius:2px;
  position:relative;
  overflow:hidden;
}
.card-slot::after{
  content:'';position:absolute;top:50%;left:0;right:0;
  height:2px;background:#1a3355;margin-top:-1px;
}
.card-text{font-size:8px;color:#555;line-height:1.3}
.card-text strong{color:#4488ff;display:block;font-size:9px}
 
/* 버튼들 */
.action-btns{
  display:flex;
  flex-direction:column;
  gap:4px;
}
.btn-buy{
  background:linear-gradient(180deg,#ff5533,#cc2200);
  color:#fff;
  border:none;
  border-radius:5px;
  padding:8px;
  font-size:11px;
  font-weight:700;
  font-family:'Noto Sans KR',sans-serif;
  cursor:pointer;
  box-shadow:0 3px 0 #881100,0 4px 8px rgba(0,0,0,0.4);
  transition:all .1s;
  letter-spacing:.03em;
}
.btn-buy:hover{background:linear-gradient(180deg,#ff6644,#dd3311)}
.btn-buy:active{transform:translateY(2px);box-shadow:0 1px 0 #881100}
.btn-cancel{
  background:linear-gradient(180deg,#444,#222);
  color:#aaa;
  border:1px solid #555;
  border-radius:5px;
  padding:5px;
  font-size:9px;
  font-family:'Noto Sans KR',sans-serif;
  cursor:pointer;
  transition:all .1s;
}
.btn-cancel:hover{background:linear-gradient(180deg,#555,#333);color:#ccc}
 
/* 거스름돈 배출구 */
.change-tray{
  background:#0a0a0a;
  border:2px solid #1a1a1a;
  border-radius:4px;
  padding:4px;
  text-align:center;
}
.change-slot{
  background:#000;
  height:8px;
  border-radius:3px;
  border:1px solid #222;
  margin-bottom:3px;
}
.change-label{font-size:7px;color:#333;letter-spacing:.05em}
 
/* 하단 출구 */
.pickup-area{
  background:#0a1208;
  border-top:4px solid #0d3318;
  border-radius:0 0 6px 6px;
  height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:-10px -10px -10px;
  margin-top:8px;
  position:relative;
}
.pickup-door{
  width:200px;height:22px;
  background:#050a04;
  border:2px solid #1a3320;
  border-radius:4px;
  box-shadow:inset 0 2px 4px rgba(0,0,0,0.8);
  display:flex;align-items:center;justify-content:center;
}
.pickup-door span{font-size:8px;color:#224422;letter-spacing:.1em}
 
/* 토스트 알림 */
.toast{
  position:fixed;
  top:24px;left:50%;transform:translateX(-50%) translateY(-80px);
  background:#1a3a22;
  color:#aaffbb;
  border:1px solid #2d6e3a;
  border-radius:8px;
  padding:10px 20px;
  font-size:13px;
  font-family:'Noto Sans KR',sans-serif;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1);
  z-index:999;
  white-space:nowrap;
  box-shadow:0 4px 20px rgba(0,0,0,0.5);
}
.toast.show{transform:translateX(-50%) translateY(0)}
 
/* 애니메이션 */
@keyframes drop{
  0%{transform:translateY(-20px);opacity:0}
  60%{transform:translateY(4px)}
  100%{transform:translateY(0);opacity:1}
}
.drink-drop{animation:drop .4s ease-out}
</style>
</head>
<body>
 
<div class="toast" id="toast"></div>
 
<div class="machine">
  <!-- 상단 바 -->
  <div class="top-bar">
    <div class="machine-title">음료 자판기</div>
    <div class="temp-badge">❄ 냉장 / 온장 ☕</div>
  </div>
 
  <!-- 음료 디스플레이 창 -->
  <div class="display-window">
    <div class="shelf-light"></div>
 
    <!-- 1단: 탄산 캔 -->
    <div class="shelf">
      <div class="shelf-items" id="shelf1"></div>
      <div class="price-row" id="price1"></div>
    </div>
 
    <div class="shelf-light"></div>
 
    <!-- 2단: 페트병 -->
    <div class="shelf">
      <div class="shelf-items" id="shelf2"></div>
      <div class="price-row" id="price2"></div>
    </div>
 
    <div class="shelf-light"></div>
 
    <!-- 3단: 캔 음료 -->
    <div class="shelf">
      <div class="shelf-items" id="shelf3"></div>
      <div class="price-row" id="price3"></div>
    </div>
  </div>
 
  <!-- 하단 패널 -->
  <div class="bottom-panel">
 
    <!-- 광고판 -->
    <div class="ad-board">
      <div class="ad-brand">LOTTE</div>
      <div class="ad-name">칠성<span>사이다</span></div>
      <div class="ad-sub">CHILSUNG CIDER ★</div>
    </div>
 
    <!-- 조작부 -->
    <div class="control-panel">
      <!-- LCD -->
      <div class="lcd">
        <div class="lcd-row1">투입금액</div>
        <div class="lcd-amount" id="lcd-amount">₩ 0</div>
        <div class="lcd-status" id="lcd-status">동전을 넣어주세요</div>
      </div>
 
      <!-- 동전 투입 -->
      <div class="coin-slot-area">
        <div class="slot-label">동전 투입</div>
        <div class="coin-slot"></div>
        <div class="coin-btns">
          <div class="coin-btn" onclick="insertCoin(100)">100</div>
          <div class="coin-btn" onclick="insertCoin(500)">500</div>
          <div class="coin-btn" onclick="insertCoin(1000)">1000</div>
        </div>
      </div>
 
      <!-- 카드 리더기 -->
      <div class="card-reader" onclick="insertCoin(3000)">
        <div class="card-slot"></div>
        <div class="card-text"><strong>카드/Pay</strong>터치하세요</div>
      </div>
 
      <!-- 구매/취소 버튼 -->
      <div class="action-btns">
        <button class="btn-buy" onclick="buyDrink()">구 매</button>
        <button class="btn-cancel" onclick="cancelInsert()">반환 / 취소</button>
      </div>
 
      <!-- 거스름돈 -->
      <div class="change-tray">
        <div class="change-slot"></div>
        <div class="change-label">거스름돈</div>
      </div>
    </div>
  </div>
 
  <!-- 음료 출구 -->
  <div class="pickup-area">
    <div class="pickup-door"><span>음료 출구</span></div>
  </div>
</div>
 
<script>
const drinks = [
  // 1단: 캔 탄산 (7개)
  [
    {name:'칠성사이다',price:1100,type:'can',color:'linear-gradient(180deg,#22aa44,#116622)',label:'칠성\n사이다'},
    {name:'펩시콜라',price:1100,type:'can',color:'linear-gradient(180deg,#1133bb,#0a1a77)',label:'PEPSI'},
    {name:'환타',price:1000,type:'can',color:'linear-gradient(180deg,#ff8800,#cc5500)',label:'환타'},
    {name:'스파클링',price:1200,type:'can',color:'linear-gradient(180deg,#dd2244,#991133)',label:'스파\n클링'},
    {name:'스파클링레몬',price:1200,type:'can',color:'linear-gradient(180deg,#ccdd00,#889900)',label:'레몬\n사이다'},
    {name:'코카콜라',price:1100,type:'can',color:'linear-gradient(180deg,#cc1111,#880000)',label:'COCA\nCOLA'},
    {name:'고갈비',price:1000,type:'can',color:'linear-gradient(180deg,#2244aa,#112266)',label:'고갈\n비'},
  ],
  // 2단: 페트병 (6개)
  [
    {name:'아이시스8.0',price:900,type:'bottle',color:'linear-gradient(180deg,rgba(180,210,240,0.9),rgba(140,180,220,0.8))',label:'아이\n시스',textColor:'#335577'},
    {name:'몸수소수',price:1000,type:'bottle',color:'linear-gradient(180deg,rgba(160,200,230,0.85),rgba(120,170,210,0.8))',label:'수소\n수',textColor:'#224466'},
    {name:'옥수수수염차',price:1200,type:'bottle',color:'linear-gradient(180deg,rgba(210,190,140,0.9),rgba(180,160,100,0.85))',label:'옥수\n수차',textColor:'#554422'},
    {name:'지평막걸리',price:1500,type:'bottle',color:'linear-gradient(180deg,rgba(240,235,220,0.95),rgba(220,210,185,0.9))',label:'막걸\n리',textColor:'#665544'},
    {name:'밀키스',price:1200,type:'bottle',color:'linear-gradient(180deg,rgba(180,200,240,0.9),rgba(140,170,220,0.85))',label:'밀키\n스',textColor:'#334488'},
    {name:'밀키스멜론',price:1200,type:'bottle',color:'linear-gradient(180deg,rgba(160,220,170,0.9),rgba(120,190,130,0.85))',label:'밀키\n스M',textColor:'#225533'},
  ],
  // 3단: 캔 (6개)
  [
    {name:'레쓰비',price:800,type:'can',color:'linear-gradient(180deg,#aa7733,#774422)',label:'레쓰\n비'},
    {name:'레쓰비카라멜',price:900,type:'can',color:'linear-gradient(180deg,#cc9944,#886611)',label:'카라\n멜'},
    {name:'맥콜',price:900,type:'can',color:'linear-gradient(180deg,#337722,#1a4411)',label:'맥콜'},
    {name:'2% 부족할때',price:1000,type:'can',color:'linear-gradient(180deg,#338855,#1a5533)',label:'2%'},
    {name:'스파클링복숭아',price:1200,type:'can',color:'linear-gradient(180deg,#ffaa66,#cc6633)',label:'복숭\n아'},
    {name:'카스',price:1500,type:'can',color:'linear-gradient(180deg,#2255aa,#113377)',label:'카스'},
  ]
];
 
let inserted = 0;
let selected = null;
 
function buildShelves(){
  drinks.forEach((shelf,si)=>{
    const shelfEl = document.getElementById(`shelf${si+1}`);
    const priceEl = document.getElementById(`price${si+1}`);
    shelf.forEach((d,di)=>{
      const wrap = document.createElement('div');
      wrap.className='drink';
      wrap.dataset.shelf=si;
      wrap.dataset.idx=di;
      wrap.onclick=()=>selectDrink(si,di,wrap);
 
      const item = document.createElement('div');
      item.className = d.type==='can' ? 'can' : 'bottle';
      item.style.background = d.color;
      if(d.textColor) item.style.color = d.textColor;
      item.style.whiteSpace='pre-line';
      item.textContent = d.label;
      wrap.appendChild(item);
      shelfEl.appendChild(wrap);
 
      const pc = document.createElement('div');
      pc.className='price-cell';
      pc.textContent=`₩${d.price.toLocaleString()}`;
      priceEl.appendChild(pc);
    });
  });
}
 
function selectDrink(si,di,el){
  document.querySelectorAll('.drink').forEach(d=>d.classList.remove('selected'));
  el.classList.add('selected');
  selected={shelf:si,idx:di};
  const d=drinks[si][di];
  updateStatus(`${d.name} 선택됨 — ₩${d.price.toLocaleString()}`);
}
 
function insertCoin(amount){
  inserted+=amount;
  updateLCD();
  showToast(`₩${amount.toLocaleString()} 투입 → 누적 ₩${inserted.toLocaleString()}`);
}
 
function updateLCD(){
  document.getElementById('lcd-amount').textContent=`₩ ${inserted.toLocaleString()}`;
  if(selected){
    const d=drinks[selected.shelf][selected.idx];
    if(inserted>=d.price) updateStatus('✓ 구매 가능');
    else updateStatus(`₩${(d.price-inserted).toLocaleString()} 더 필요`);
  } else {
    updateStatus(inserted>0?'음료를 선택하세요':'동전을 넣어주세요');
  }
}
 
function updateStatus(msg){
  document.getElementById('lcd-status').textContent=msg;
}
 
function buyDrink(){
  if(!selected){showToast('음료를 먼저 선택해주세요!');return;}
  const d=drinks[selected.shelf][selected.idx];
  if(inserted<d.price){
    showToast(`₩${(d.price-inserted).toLocaleString()} 부족합니다`);
    return;
  }
  const change=inserted-d.price;
  inserted=0;
  showToast(`🥤 ${d.name} 나왔습니다! 거스름돈 ₩${change.toLocaleString()}`);
  document.querySelectorAll('.drink').forEach(el=>el.classList.remove('selected'));
  selected=null;
  updateLCD();
}
 
function cancelInsert(){
  if(inserted===0){showToast('투입된 금액이 없습니다');return;}
  showToast(`₩${inserted.toLocaleString()} 반환됩니다`);
  inserted=0;
  selected=null;
  document.querySelectorAll('.drink').forEach(el=>el.classList.remove('selected'));
  updateLCD();
}
 
let toastTimer;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}
 
buildShelves();
</script>
</body>
</html>
