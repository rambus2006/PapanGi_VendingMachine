<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>관리자페이지</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="static/css/style.css" />
  </head>
  <body>
    <!-- ── 로그인 오버레이 ── -->
    <div class="login-overlay" id="loginOverlay">
      <div class="login-box">
        <div class="login-title">⚙ 관리자</div>
        <input
          type="password"
          id="loginInput"
          class="login-input"
          placeholder="비밀번호"
          onkeydown="if (event.key === 'Enter') doLogin();"
        />
        <button class="login-btn" onclick="doLogin()">로그인</button>
      </div>
    </div>

    <!-- ── 대시보드 ── -->
    <div class="dashboard" id="dashboard" style="display: none">
      <header class="header">
        <span class="header-title">⚙ 자판기 관리자</span>
        <div class="header-right">
          <span class="header-sub" id="headerTime"></span>
          <button class="logout-btn" onclick="doLogout()">로그아웃</button>
        </div>
      </header>

      <nav class="tab-nav">
        <button class="tab-btn active" onclick="switchTab('drinks', this)">
          음료 관리
        </button>
        <button class="tab-btn" onclick="switchTab('stock', this)">
          재고 관리
        </button>
        <button class="tab-btn" onclick="switchTab('stats', this)">
          매출 통계
        </button>
      </nav>

      <!-- ── 음료 관리 탭 ── -->
      <section class="tab-panel" id="tab-drinks">
        <div class="panel-header">
          <span class="panel-title">음료 목록</span>
          <button class="btn-add" onclick="openDrinkModal()">+ 추가</button>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>이름</th>
                <th>가격</th>
                <th>재고</th>
                <th>타입</th>
                <th>관리</th>
              </tr>
            </thead>
            <tbody id="drinkTableBody"></tbody>
          </table>
        </div>
      </section>

      <!-- ── 재고 관리 탭 ── -->
      <section class="tab-panel hidden" id="tab-stock">
        <div class="panel-header">
          <span class="panel-title">재고 현황</span>
          <button class="btn-add" onclick="loadStock()">↻ 새로고침</button>
        </div>
        <div class="stock-grid" id="stockGrid"></div>
      </section>

      <!-- ── 매출 통계 탭 ── -->
      <section class="tab-panel hidden" id="tab-stats">
        <div class="panel-header">
          <span class="panel-title">매출 통계</span>
          <div class="date-range">
            <input type="date" id="dateFrom" />
            <span>~</span>
            <input type="date" id="dateTo" />
            <button class="btn-search" onclick="loadStats()">조회</button>
          </div>
        </div>
        <div class="stat-cards" id="statCards"></div>
        <div class="table-wrap" style="margin-top: 1rem">
          <table class="data-table">
            <thead>
              <tr>
                <th>날짜</th>
                <th>음료명</th>
                <th>판매수</th>
                <th>매출</th>
              </tr>
            </thead>
            <tbody id="statsTableBody"></tbody>
          </table>
        </div>
      </section>
    </div>

    <!-- ── 음료 추가/수정 모달 ── -->
    <div class="modal-overlay hidden" id="drinkModal">
      <div class="modal">
        <div class="modal-title" id="modalTitle">음료 추가</div>
        <input type="hidden" id="modalId" />
        <label class="field-label">이름</label>
        <input
          type="text"
          id="modalName"
          class="field-input"
          placeholder="예) 콜라"
        />
        <label class="field-label">가격 (₩)</label>
        <input
          type="number"
          id="modalPrice"
          class="field-input"
          placeholder="1500"
        />
        <label class="field-label">초기 재고</label>
        <input
          type="number"
          id="modalStock"
          class="field-input"
          placeholder="10"
        />
        <div class="modal-btns">
          <button class="btn-cancel-modal" onclick="closeDrinkModal()">
            취소
          </button>
          <button class="btn-save" onclick="saveDrink()">저장</button>
        </div>
      </div>
    </div>

    <script src="static/js/toast.js"></script>
    <script src="static/js/admin.js"></script>
  </body>
</html>
